syntax = "proto3";
package learning;

// v1: field numbers are permanent. Reserve removed numbers in future revisions.
enum EventType {
  UNKNOWN = 0;
  HELLO = 1;
  SEND_MESSAGE = 2;
  MESSAGE_CREATED = 3;
  ACK = 4;
  ERROR = 5;
  CONVERSATION_CHANGED = 6;
}
enum MessageKind { TEXT = 0; AUDIO = 1; IMAGE = 2; }
message Media {
  string id = 1;
  string mime_type = 2;
  string original_name = 3;
  uint32 size = 4;
  uint32 duration_ms = 5;
}
message ChatMessage {
  string id = 1;
  string conversation_id = 2;
  string client_message_id = 3;
  MessageKind kind = 4;
  string text = 5;
  string media_id = 6;
  string created_at = 7;
  Media media = 8;
}
message Conversation {
  string id = 1;
  string title = 2;
  string updated_at = 3;
}
message Envelope {
  uint32 version = 1;
  string request_id = 2;
  EventType type = 3;
  ChatMessage message = 4;
  string conversation_id = 5;
  string error = 6;
  Conversation conversation = 7;
}
