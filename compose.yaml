services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: learning
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
